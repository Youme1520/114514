name: Build Android APK

# 影像技术刷题宝 - Flutter Android 云端打包工作流
# 触发方式：
#   1. 推送到 main 分支时自动触发
#   2. 在 GitHub Actions 页面手动点击 "Run workflow" 触发

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  build-apk:
    name: 构建 Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 配置 Java 17 环境
      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 配置 Flutter 环境（使用稳定版）
      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      # 4. 验证 Flutter 环境
      - name: 验证 Flutter 环境
        run: flutter --version

      # 4.5 若缺少 android 原生工程目录，则用 flutter create 自动生成
      #     （本项目源码仅含 lib/ 与 pubspec.yaml，原生壳由官方工具生成，保证版本匹配）
      - name: 生成 Android 原生工程（若缺失）
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.yingxiang.tiku --project-name yingxiang_tiku_app .
          fi

      # 5. 拉取依赖
      - name: 安装依赖 (flutter pub get)
        run: flutter pub get

      # 5.1 运行单元测试（解析/判分/断点续传/数据完整性）
      - name: 运行单元测试 (flutter test)
        run: flutter test

      # 5.5 配置 Android 应用名与网络权限
      #     - 将应用显示名改为「影像技术刷题宝」
      #     - 确保 AndroidManifest 声明 INTERNET 权限（AI 接口联网必需）
      - name: 配置应用名与网络权限
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 添加 INTERNET 权限（若尚未声明）
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          fi
          # 设置应用显示名（应用标签）
          sed -i 's|android:label="yingxiang_tiku_app"|android:label="影像技术刷题宝"|' "$MANIFEST"

      # 6. 构建 Release APK
      - name: 构建 Release APK
        run: flutter build apk --release

      # 7. 上传 APK 作为构建产物
      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yingxiang-tiku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # （可选）同时上传分 ABI 拆分的 APK，体积更小
      - name: 上传 APK 构建产物（按架构拆分）
        uses: actions/upload-artifact@v4
        with:
          name: yingxiang-tiku-apk-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
