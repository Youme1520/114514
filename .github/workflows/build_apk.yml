name: Build Android APK

# 影像技术刷题宝 - Flutter Android 云端打包工作流
# 触发方式：
#   1. 推送到 main 分支时自动触发
#   2. 在 GitHub Actions 页面手动点击 "Run workflow" 触发

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  build-apk:
    name: 构建 Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout 代码
        uses: actions/checkout@v5

      # 2. 配置 Java 17 环境
      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 配置 Flutter 环境（使用稳定版）
      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      # 4. 验证 Flutter 环境
      - name: 验证 Flutter 环境
        run: flutter --version

      # 4.5 若缺少 android 原生工程目录，则用 flutter create 自动生成
      #     （本项目源码仅含 lib/ 与 pubspec.yaml，原生壳由官方工具生成，保证版本匹配）
      - name: 生成 Android 原生工程（若缺失）
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.yingxiang.tiku --project-name yingxiang_tiku_app .
            # 删除 flutter create 自动生成的默认模板测试（引用不存在的 MyApp，会导致 flutter test 编译失败）
            rm -f test/widget_test.dart
          fi

      # 4.6 注入备用 Maven 镜像源，规避 Maven 中央仓库 HTTP 429 限流
      #     - 在阿里云镜像之间做首选，并保留 google/mavenCentral 作为兜底
      #     - 同时兼容 Groovy DSL(.gradle) 与 Kotlin DSL(.gradle.kts) 两种工程
      #     - 镜像放在 google() 之前，官方源兜底，避免镜像同步不完整导致的缺失
      - name: 配置 Gradle 镜像源（防 429 限流）
        run: |
          # 将注入逻辑写入临时脚本文件，避免 heredoc 与 YAML 块标量冲突
          cat > /tmp/inject_mirror.py <<'PYEOF'
          import sys, re
          p, dsl = sys.argv[1], sys.argv[2]
          s = open(p, encoding='utf-8').read()
          if dsl == 'kts':
              mirrors = "\n".join([
                  "        maven(\"https://maven.aliyun.com/repository/google\")",
                  "        maven(\"https://maven.aliyun.com/repository/public\")",
                  "        maven(\"https://maven.aliyun.com/repository/central\")",
                  "        maven(\"https://maven.aliyun.com/repository/gradle-plugin\")",
              ])
          else:
              mirrors = "\n".join([
                  "        maven { url 'https://maven.aliyun.com/repository/google' }",
                  "        maven { url 'https://maven.aliyun.com/repository/public' }",
                  "        maven { url 'https://maven.aliyun.com/repository/central' }",
                  "        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }",
              ])
          new = re.sub(r'(repositories\s*\{)', r'\1\n' + mirrors, s)
          if new != s:
              open(p, 'w', encoding='utf-8').write(new)
              print('[OK] ' + p + ' injected')
          else:
              print('[SKIP] ' + p + ' no repositories block')
          PYEOF
          # 需要注入镜像的文件清单（Flutter 3.24 默认生成 Groovy DSL）
          for f in android/settings.gradle android/build.gradle android/settings.gradle.kts android/build.gradle.kts; do
            [ -f "$f" ] || continue
            echo ">>> processing $f"
            case "$f" in
              *.kts) DSL=kts ;;
              *)     DSL=groovy ;;
            esac
            python3 /tmp/inject_mirror.py "$f" "$DSL"
          done

      # 5. 拉取依赖
      - name: 安装依赖 (flutter pub get)
        run: flutter pub get

      # 5.0 写入全局 Gradle init 脚本（最彻底的防 429 兜底）
      #     - init.gradle 对任何工程结构都生效，无论 settings.gradle 用哪种 DSL
      #     - 阿里云镜像优先，google/mavenCentral 兜底
      - name: 配置全局 Gradle 镜像（init.gradle）
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "=== 已写入 ~/.gradle/init.gradle ==="
          cat ~/.gradle/init.gradle

      # 5.1 运行单元测试（解析/判分/断点续传/数据完整性）
      #     先安装 libsqlite3：sqflite_common_ffi v2 在 Linux 上依赖系统 SQLite 库
      #     （ubuntu-latest 24.04 默认不预装，缺少会导致数据库单测报 libsqlite3.so 加载失败）
      - name: 安装 SQLite 系统库
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      # 5.2 运行单元测试，使用 expanded reporter 便于定位失败用例的具体断言
      - name: 运行单元测试 (flutter test)
        run: flutter test --reporter=expanded

      # 5.5 配置 Android 应用名与网络权限
      #     - 将应用显示名改为「影像技术刷题宝」
      #     - 确保 AndroidManifest 声明 INTERNET 权限（AI 接口联网必需）
      - name: 配置应用名与网络权限
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 添加 INTERNET 权限（若尚未声明）
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          fi
          # 设置应用显示名（应用标签）
          sed -i 's|android:label="yingxiang_tiku_app"|android:label="影像技术刷题宝"|' "$MANIFEST"

      # 6. 构建 Release APK（带重试，规避瞬时 429 网络抖动）
      - name: 构建 Release APK
        run: |
          # Gradle 下载依赖偶发 429，重试最多 3 次
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试构建 APK ==="
            if flutter build apk --release; then
              echo "=== 构建成功 ==="
              exit 0
            fi
            echo "=== 第 $i 次构建失败，等待后重试 ==="
            sleep $((i * 30))
          done
          echo "=== 3 次构建均失败 ==="
          exit 1

      # 7. 上传 APK 作为构建产物
      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yingxiang-tiku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # （可选）同时上传分 ABI 拆分的 APK，体积更小
      - name: 上传 APK 构建产物（按架构拆分）
        uses: actions/upload-artifact@v4
        with:
          name: yingxiang-tiku-apk-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
